<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amara's Story — Card Deck · Building Bridges</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --purple:#9152FF;--purple-dark:#7339E0;--purple-light:#B580FF;
  --lavender:#F2EEFF;--surface:#F5F0FF;--white:#FFFFFF;
  --ink:#1A1033;--muted:#6B5F8A;--sage:#6BAA8A;--amber:#C08800;
  --border:rgba(145,82,255,.15);--shadow:0 24px 70px rgba(145,82,255,.20);
}
html,body{height:100%;font-family:'Sora',sans-serif;background:linear-gradient(135deg,var(--lavender),#fff);color:var(--ink);overflow:hidden;user-select:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(145,82,255,.18),transparent 32%),radial-gradient(circle at 88% 76%,rgba(107,170,138,.18),transparent 30%),radial-gradient(circle at 70% 10%,rgba(192,136,0,.10),transparent 25%);z-index:-1}
body::after{content:'';position:fixed;inset:0;z-index:9997;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");opacity:.45}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--purple),var(--purple-light));z-index:9999;transition:width .4s ease;box-shadow:0 0 14px rgba(145,82,255,.45)}
#topui{position:fixed;top:4px;left:0;right:0;z-index:998;padding:1rem 1.8rem;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 8px 26px rgba(145,82,255,.08)}
.top-logo{font-family:'Lora',serif;font-size:1rem;font-weight:700;color:var(--ink);letter-spacing:-.01em}.top-logo span{color:var(--purple)}
#card-counter{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
#top-back{background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.45rem 1rem;color:var(--purple);font-size:.75rem;cursor:pointer;text-decoration:none;font-family:'Sora',sans-serif;font-weight:700;transition:all .2s}#top-back:hover{background:var(--purple);color:white;transform:translateY(-1px)}
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;padding-top:40px}.bg-card{position:absolute;width:min(420px,88vw);height:min(580px,78vh);border-radius:28px;transition:transform .5s ease,opacity .5s ease;border:1px solid var(--border)}.bg-card-1{background:rgba(255,255,255,.55);transform:translateY(14px) scale(.94);z-index:1}.bg-card-2{background:rgba(181,128,255,.14);transform:translateY(26px) scale(.88);z-index:0}
#main-card{position:absolute;z-index:10;width:min(420px,88vw);height:min(580px,78vh);border-radius:28px;overflow:hidden;cursor:grab;box-shadow:var(--shadow),0 0 0 1px var(--border);transition:box-shadow .3s;touch-action:none;background:white}#main-card:active{cursor:grabbing}#main-card.animating{transition:transform .45s cubic-bezier(.25,.46,.45,.94),opacity .45s ease}#main-card.swipe-left{transform:translateX(-130%) rotate(-18deg)!important;opacity:0}#main-card.swipe-right{transform:translateX(130%) rotate(18deg)!important;opacity:0}#main-card.enter-right{animation:enterRight .45s cubic-bezier(.25,.46,.45,.94) forwards}#main-card.enter-left{animation:enterLeft .45s cubic-bezier(.25,.46,.45,.94) forwards}@keyframes enterRight{from{transform:translateX(80%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}@keyframes enterLeft{from{transform:translateX(-80%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
#tilt-left,#tilt-right{position:absolute;top:1.5rem;z-index:20;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .9rem;border-radius:100px;opacity:0;transition:opacity .15s;pointer-events:none}#tilt-left{left:1.2rem;background:rgba(192,136,0,.13);color:var(--amber);border:1px solid rgba(192,136,0,.35)}#tilt-right{right:1.2rem;background:rgba(107,170,138,.13);color:var(--sage);border:1px solid rgba(107,170,138,.35)}
.card-inner{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}.ct-cover,.ct-quote,.ct-stat,.ct-moment,.ct-wisdom,.ct-cta{background:linear-gradient(160deg,#ffffff 0%,var(--surface) 100%)}.card-deco{position:absolute;border-radius:50%;pointer-events:none;filter:blur(50px);opacity:.22}.card-num{position:absolute;bottom:1.2rem;right:1.5rem;font-family:'Lora',serif;font-size:4rem;font-weight:700;opacity:.07;line-height:1;pointer-events:none;color:var(--purple)}
.card-tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;padding:.34rem .85rem;border-radius:100px;margin-bottom:1.4rem;border:1px solid var(--border)}.tag-chapter{background:var(--surface);color:var(--purple)}.tag-quote{background:rgba(145,82,255,.08);color:var(--purple-dark)}.tag-lesson{background:rgba(107,170,138,.14);color:#477b62}.tag-stat{background:rgba(192,136,0,.12);color:var(--amber)}
.card-body{flex:1;padding:2rem;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}.card-h1{font-family:'Lora',serif;font-size:clamp(2.4rem,8vw,3.4rem);font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:.8rem;color:var(--ink)}.card-h1 em{font-style:italic;font-weight:400;color:var(--purple)}.card-h2{font-family:'Lora',serif;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:600;font-style:italic;line-height:1.25;margin-bottom:1rem;color:var(--ink)}.card-p{font-size:clamp(.88rem,2.5vw,1rem);line-height:1.75;color:var(--muted);font-weight:400}.card-p strong{font-weight:700;color:var(--ink)}.card-bignum{font-family:'Lora',serif;font-size:clamp(5rem,18vw,8rem);font-weight:700;line-height:1;letter-spacing:-.05em;color:var(--purple)}.card-bignum-label{font-size:.85rem;color:var(--muted);margin-top:.3rem}.card-quote-text{font-family:'Lora',serif;font-size:clamp(1.3rem,4.5vw,1.9rem);font-style:italic;font-weight:400;line-height:1.4;border-left:3px solid var(--purple);padding-left:1.2rem;color:var(--ink)}.struck{text-decoration:line-through;text-decoration-color:var(--amber);text-decoration-thickness:4px;color:var(--purple)}.gold-word{color:var(--amber);font-family:'Lora',serif;font-weight:700;font-size:1.3em;letter-spacing:-.03em}
.card-footer{padding:1.2rem 2rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;background:rgba(255,255,255,.45)}.card-footer-name{font-size:.72rem;color:var(--muted);font-weight:600}.card-footer-dots{display:flex;gap:4px}.fdot{width:6px;height:6px;border-radius:50%;background:rgba(145,82,255,.18)}.fdot.active{background:var(--purple)}
.cta-btns-card{display:flex;flex-direction:column;gap:.8rem;margin-top:1.5rem}.cta-p{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;padding:.85rem;border-radius:100px;font-weight:700;font-size:.9rem;text-align:center;text-decoration:none;border:none;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 8px 24px rgba(145,82,255,.35);transition:transform .2s}.cta-p:hover{transform:translateY(-1px)}.cta-g{background:white;color:var(--purple);padding:.85rem;border-radius:100px;border:1px solid var(--border);font-size:.9rem;text-align:center;cursor:pointer;font-family:'Sora',sans-serif;font-weight:700;transition:all .2s;text-decoration:none;display:block}.cta-g:hover{background:var(--surface);border-color:var(--purple)}
#controls{position:fixed;bottom:1.8rem;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:1.2rem;z-index:998}.ctrl{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:1.1rem;transition:transform .2s,background .2s}.ctrl-prev{background:white;color:var(--muted);border:1px solid var(--border)}.ctrl-prev:hover{background:var(--surface);color:var(--purple);transform:scale(1.08)}.ctrl-prev:disabled{opacity:.35;cursor:not-allowed;transform:none}.ctrl-next{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;box-shadow:0 8px 24px rgba(145,82,255,.36)}.ctrl-next:hover{transform:scale(1.08)}.ctrl-next:disabled{opacity:.35;cursor:not-allowed;transform:none}#swipe-hint{position:fixed;bottom:6.5rem;left:50%;transform:translateX(-50%);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .5s;font-weight:700}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="topui"><div class="top-logo">Building<span>Bridges</span></div><div id="card-counter">1 / 12</div><a href="#" id="top-back">&#8592; Stories</a></div>
<div id="deck"><div class="bg-card bg-card-2"></div><div class="bg-card bg-card-1"></div><div id="main-card"><div id="tilt-left">&#8592; Prev</div><div id="tilt-right">Next &#8594;</div></div></div>
<div id="controls"><button class="ctrl ctrl-prev" id="prev-btn" onclick="prevCard()" disabled>&#8592;</button><button class="ctrl ctrl-next" id="next-btn" onclick="nextCard()">&#8594;</button></div><div id="swipe-hint">Swipe or tap arrows</div>
<script>
const cards=[{type:'cover',tag:'tag-chapter',tagText:'Building Bridges &middot; Story',content:`<div class="card-deco" style="width:300px;height:300px;background:#9152FF;top:-80px;right:-80px"></div><div class="card-deco" style="width:200px;height:200px;background:#6BAA8A;bottom:-60px;left:-40px"></div><div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#9152FF,#6BAA8A);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:1.5rem;color:white">&#128105;&#127998;</div><div class="card-h1">Dr. Amara<br><em>Osei</em></div><div class="card-p" style="margin-top:.5rem">Clinical Psychologist &middot; Berlin<br><span style="color:var(--purple);font-weight:700">From Ghana. Age 14. No German.</span></div><div style="margin-top:1.5rem;font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700">Tap &#8594; to begin</div>`},{type:'moment',tag:'tag-chapter',tagText:'Chapter 1 &mdash; Arrival',content:`<div class="card-deco" style="width:280px;height:280px;background:#B580FF;top:-60px;right:-60px"></div><div class="card-h1" style="font-size:clamp(2rem,7vw,3rem)">Ghana.<br>Age&nbsp;<em>14.</em><br>Germany.</div><div class="card-p" style="margin-top:1rem">My German was almost zero. I sat in class understanding maybe every fifth word the teacher said.</div>`},{type:'quote',tag:'tag-quote',tagText:'Her words',content:`<div class="card-deco" style="width:320px;height:320px;background:#9152FF;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-quote-text">&ldquo;I smiled a lot because I didn&apos;t know what else to do.<br><br>People thought I was confident.<br><br>I was <strong style="color:var(--purple);font-style:normal">terrified.</strong>&rdquo;</div>`},{type:'moment',tag:'tag-chapter',tagText:'Chapter 2 &mdash; Her Mother',content:`<div class="card-deco" style="width:300px;height:300px;background:#C08800;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-h1" style="color:var(--purple);font-size:clamp(2rem,7vw,2.8rem)">She broke<br><em>down.</em></div><div class="card-p" style="margin-top:1rem">Work stress. Isolation. No support system. In their community — <strong>you prayed, you kept going, you didn&apos;t talk about it.</strong></div>`},{type:'quote',tag:'tag-quote',tagText:'The decision',content:`<div class="card-deco" style="width:300px;height:300px;background:#6BAA8A;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-quote-text" style="border-left-color:var(--sage)">&ldquo;Someone should have been there for her. Someone who understood where she came from.<br><br>I decided to become <strong style="color:var(--sage);font-style:normal">that person.</strong>&rdquo;</div>`},{type:'stat',tag:'tag-stat',tagText:'Chapter 3 &mdash; The Room',content:`<div class="card-deco" style="width:300px;height:300px;background:#9152FF;top:-80px;right:-60px;opacity:.22"></div><div class="card-p" style="margin-bottom:.5rem">First lecture. She counted.</div><div class="card-bignum">47</div><div class="card-bignum-label">students in the room.</div><div style="margin-top:1.2rem;font-family:'Lora',serif;font-style:italic;font-size:clamp(1.1rem,3.5vw,1.5rem);color:var(--purple)">She was the only Black woman.</div>`},{type:'moment',tag:'tag-chapter',tagText:'Still in that room',content:`<div class="card-deco" style="width:280px;height:280px;background:#B580FF;bottom:-60px;left:-40px"></div><div class="card-p" style="font-size:clamp(.95rem,3vw,1.1rem)">The professor was explaining Freud.</div><div class="card-quote-text" style="margin-top:1.2rem;font-size:clamp(1.1rem,3.5vw,1.6rem)">&ldquo;None of this was written for me, or about me, or with me in mind.&rdquo;</div><div class="card-p" style="margin-top:1.2rem">She almost left after the first semester.</div>`},{type:'moment',tag:'tag-chapter',tagText:'Chapter 4 &mdash; The Rejection',content:`<div class="card-deco" style="width:320px;height:320px;background:#C08800;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-p">Her supervisor called her research on mental health in diaspora communities &mdash;</div><div style="font-family:'Lora',serif;font-size:clamp(2.5rem,9vw,4rem);font-weight:700;line-height:1;margin:1rem 0;letter-spacing:-.04em" class="struck">&ldquo;too niche.&rdquo;</div><div class="card-p">She cried for two days.</div><div class="card-p" style="margin-top:.6rem">Then she rewrote it.</div>`},{type:'stat',tag:'tag-stat',tagText:'The result',content:`<div class="card-deco" style="width:300px;height:300px;background:#C08800;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-p" style="margin-bottom:.8rem;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:var(--muted)">Her research on diaspora mental health</div><div class="gold-word" style="font-size:clamp(3rem,10vw,5rem);display:block;line-height:1">Published.</div><div class="card-p" style="margin-top:1rem">He came to congratulate her. She thanked him. <strong>Because that rejection made her fight harder.</strong></div>`},{type:'wisdom',tag:'tag-lesson',tagText:'Chapter 5 &mdash; The Lesson',content:`<div class="card-deco" style="width:350px;height:350px;background:#6BAA8A;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-h2">Being the only one in the room</div><div class="card-h2" style="color:var(--purple)">is <em>not</em> a sign</div><div class="card-h2">you don&apos;t belong.</div><div style="width:40px;height:2px;background:var(--sage);margin:1.2rem 0"></div><div class="card-h2" style="color:var(--muted);font-size:clamp(1.1rem,4vw,1.5rem)">It is a sign the room<br>hasn&apos;t caught up <em style="color:var(--amber)">yet.</em></div>`},{type:'quote',tag:'tag-lesson',tagText:'For you',content:`<div class="card-deco" style="width:300px;height:300px;background:#6BAA8A;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-quote-text" style="border-left-color:var(--sage);font-size:clamp(1.1rem,3.8vw,1.6rem)">&ldquo;If you leave, they win twice.<br><br>Once because you left &mdash;<br>and once because the next girl who looks like you<br><strong style="color:var(--purple);font-style:normal">won&apos;t see you there</strong><br>when she arrives.&rdquo;</div><div style="margin-top:1.2rem;font-size:.72rem;color:var(--muted);letter-spacing:.08em">&mdash; Dr. Amara Osei</div>`},{type:'cta',tag:'tag-chapter',tagText:'Her story. Your path.',content:`<div class="card-deco" style="width:320px;height:320px;background:#9152FF;top:50%;left:50%;transform:translate(-50%,-50%)"></div><div class="card-h1" style="font-size:clamp(2rem,7vw,2.8rem);color:var(--purple)">Inspired?</div><div class="card-p" style="margin-top:.8rem">Amara stayed. She published. She became the person she once needed. There is a place in this field for you too.</div><div class="cta-btns-card"><a href="#" class="cta-p">Join the Program &rarr;</a><button class="cta-g" onclick="goToCard(0)">&#8635; Read again</button><a href="#" class="cta-g">More stories</a></div>`}];
let current=0,isDragging=false,startX=0,currentX=0,isAnimating=false;const card=document.getElementById('main-card'),prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn'),counter=document.getElementById('card-counter'),progressBar=document.getElementById('progress-bar'),swipeHint=document.getElementById('swipe-hint');
function renderCard(idx){const c=cards[idx];const dotHTML=cards.map((_,i)=>`<div class="fdot ${i===idx?'active':''}"></div>`).join('');card.innerHTML=`<div id="tilt-left">&#8592;</div><div id="tilt-right">&#8594;</div><div class="card-inner ct-${c.type}"><div class="card-body"><div class="card-tag ${c.tag}">${c.tagText}</div>${c.content}</div><div class="card-footer"><div class="card-footer-name">Dr. Amara Osei &middot; Building Bridges</div><div class="card-footer-dots">${dotHTML}</div></div><div class="card-num">${idx+1}</div></div>`;counter.textContent=`${idx+1} / ${cards.length}`;progressBar.style.width=((idx+1)/cards.length*100)+'%';prevBtn.disabled=idx===0;nextBtn.disabled=idx===cards.length-1;if(idx>=1)swipeHint.style.opacity='0'}
function goToCard(idx,direction='right'){if(isAnimating)return;isAnimating=true;card.classList.add('animating');card.classList.add(direction==='right'?'swipe-left':'swipe-right');setTimeout(()=>{current=idx;renderCard(current);card.classList.remove('animating','swipe-left','swipe-right');card.classList.add(direction==='right'?'enter-right':'enter-left');setTimeout(()=>{card.classList.remove('enter-right','enter-left');isAnimating=false},450)},380)}
function nextCard(){if(current<cards.length-1)goToCard(current+1,'right')}function prevCard(){if(current>0)goToCard(current-1,'left')}
function onDragStart(x){if(isAnimating)return;isDragging=true;startX=x;currentX=x}function onDragMove(x){if(!isDragging)return;currentX=x;const diff=currentX-startX;card.style.transform=`translateX(${diff}px) rotate(${diff*.04}deg)`;const tL=card.querySelector('#tilt-left'),tR=card.querySelector('#tilt-right');if(tL&&tR){tL.style.opacity=diff<-20?Math.min((Math.abs(diff)-20)/60,1):0;tR.style.opacity=diff>20?Math.min((diff-20)/60,1):0}}function onDragEnd(){if(!isDragging)return;isDragging=false;const diff=currentX-startX;card.style.transform='';const tL=card.querySelector('#tilt-left'),tR=card.querySelector('#tilt-right');if(tL)tL.style.opacity=0;if(tR)tR.style.opacity=0;if(diff<-60&&current<cards.length-1)nextCard();else if(diff>60&&current>0)prevCard()}
card.addEventListener('mousedown',e=>onDragStart(e.clientX));window.addEventListener('mousemove',e=>onDragMove(e.clientX));window.addEventListener('mouseup',()=>onDragEnd());card.addEventListener('touchstart',e=>onDragStart(e.touches[0].clientX),{passive:true});window.addEventListener('touchmove',e=>onDragMove(e.touches[0].clientX),{passive:true});window.addEventListener('touchend',()=>onDragEnd());document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')nextCard();if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevCard()});renderCard(0);
</script>
</body>
</html>
